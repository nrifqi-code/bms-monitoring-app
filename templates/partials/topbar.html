<header class="bg-white border-b border-gray-200 flex items-center
               justify-between px-6 h-16 flex-shrink-0">
  <div>
    <h1 class="text-xl font-bold text-gray-900" id="page-title">
      {{ page_title }}
    </h1>
    <p class="text-sm text-gray-500">{{ page_subtitle }}</p>
  </div>
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2 border border-gray-300 rounded px-3 py-1.5">
      <span class="w-2 h-2 rounded-full bg-green-500"></span>
      <span class="text-sm text-gray-700">Battery Pack A</span>
      <span class="text-gray-400 text-xs">&#9662;</span>
    </div>
    <span class="font-mono text-sm text-gray-500" id="clock"></span>
    <button class="relative" type="button" aria-label="Active alarms">
      <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor"
           stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967
             8.967 0 0018 9.75V9A6 6 0 006 9v.75a8.967
             8.967 0 01-2.312 6.022c1.733.64 3.56 1.085
             5.455 1.31m5.714 0a24.255 24.255 0 01-5.714
             0m5.714 0a3 3 0 11-5.714 0"/>
      </svg>
      <span class="absolute -top-1 -right-1 bg-red-600 text-white text-[9px]
                   font-bold rounded-full w-4 h-4 flex items-center
                   justify-center font-mono" id="alarm-count">0</span>
    </button>
    <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center
                justify-center text-sm text-gray-600 font-semibold">T</div>
  </div>
</header>
